name: build

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# CommonLibSSE-NG is consumed as a git submodule (see extern/CommonLibSSE-NG).
# vcpkg pulls in the transitive deps it needs (spdlog, directxtk, etc.) via
# our vcpkg.json "plugin" feature. Public registry only — no custom registry.

env:
  # vcpkg-tool commit. Match our vcpkg.json builtin-baseline so the tool
  # version aligns with the package versions our manifest expects.
  VCPKG_COMMIT: ee12231b20c95013c6638d845d04c91559a1d1ff

jobs:
  test:
    name: Tests (Catch2)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:GITHUB_WORKSPACE/vcpkg
          Set-Location $env:GITHUB_WORKSPACE/vcpkg
          git checkout $env:VCPKG_COMMIT
          .\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (tests)
        run: cmake --preset tests

      - name: Build (tests)
        run: cmake --build build/tests

      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure

  build:
    name: Build & Package
    runs-on: windows-2022
    needs: test
    timeout-minutes: 60
    permissions:
      contents: write       # softprops/action-gh-release on tag pushes
      id-token: write       # actions/attest-build-provenance — mint OIDC token
      attestations: write   # actions/attest-build-provenance — write attestation
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:GITHUB_WORKSPACE/vcpkg
          Set-Location $env:GITHUB_WORKSPACE/vcpkg
          git checkout $env:VCPKG_COMMIT
          .\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Cache the build directory keyed on the submodule SHA + cmake config
      # files. Saves ~10 min of CommonLibSSE-NG recompilation on cache hit.
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build/release
          key: build-release-${{ runner.os }}-${{ hashFiles('extern/CommonLibSSE-NG/**/*.cmake', 'extern/CommonLibSSE-NG/**/CMakeLists.txt', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'vcpkg.json') }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            build-release-${{ runner.os }}-

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build build/release

      - name: Compute archive name
        id: archive
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
              $name = "WalkSpeedTuner-${{ github.ref_name }}"
          } else {
              $shortSha = "${{ github.sha }}".Substring(0, 7)
              $name = "WalkSpeedTuner-${{ github.ref_name }}-$shortSha"
          }
          $name = $name -replace '[\\/]', '-'
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stage release tree
        shell: pwsh
        run: |
          $stage = "stage/SKSE/Plugins"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build/release/bin/WalkSpeedTuner.dll $stage/
          Compress-Archive -Path stage/SKSE -DestinationPath "${{ steps.archive.outputs.name }}.zip"

      # PDB ships as a SEPARATE asset so the user-facing zip stays lean
      # (MO2 users don't need a 4-5 MB debug file in SKSE/Plugins/). The PDB
      # is for the audience that wants to decompile and read the binary.
      - name: Package PDB
        shell: pwsh
        run: |
          Compress-Archive -Path build/release/bin/WalkSpeedTuner.pdb `
                           -DestinationPath "${{ steps.archive.outputs.name }}-pdb.zip"

      # SHA-256 of both zips, as .sha256 companions AND inlined into the
      # release body so the hashes are visible on the release page without
      # having to download anything. Body lines are an array of literal +
      # interpolated strings — a `@"..."@` here-string would have PowerShell
      # eat the inline-code backticks in the markdown.
      - name: Hash + write release body
        shell: pwsh
        run: |
          $base = "${{ steps.archive.outputs.name }}"
          $repo = "${{ github.repository }}"
          $hz = (Get-FileHash "$base.zip"     -Algorithm SHA256).Hash.ToLower()
          $hp = (Get-FileHash "$base-pdb.zip" -Algorithm SHA256).Hash.ToLower()
          "$hz  $base.zip"     | Out-File "$base.zip.sha256"     -Encoding ascii
          "$hp  $base-pdb.zip" | Out-File "$base-pdb.zip.sha256" -Encoding ascii
          @(
            '## Verify your download',
            '',
            'SHA-256:',
            '```',
            "$hz  $base.zip",
            "$hp  $base-pdb.zip",
            '```',
            'Compare with `Get-FileHash <file> -Algorithm SHA256` (PowerShell) or',
            '`sha256sum -c <file>.sha256` (Unix/git-bash).',
            '',
            'Cryptographic provenance (requires the `gh` CLI):',
            '```',
            "gh attestation verify $base.zip --repo $repo",
            '```'
          ) | Out-File release-body.md -Encoding utf8

      # Signed build provenance — anyone can run
      #   gh attestation verify <file> --repo <repo>
      # and get GitHub's signed statement that the binary was built by THIS
      # workflow at THIS commit. Skipped on PR events because fork PRs have
      # id-token: write stripped by GitHub's fork-safety rules.
      - name: Attest build provenance
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/release/bin/WalkSpeedTuner.dll
            ${{ steps.archive.outputs.name }}.zip
            ${{ steps.archive.outputs.name }}-pdb.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: |
            ${{ steps.archive.outputs.name }}.zip
            ${{ steps.archive.outputs.name }}-pdb.zip
            ${{ steps.archive.outputs.name }}.zip.sha256
            ${{ steps.archive.outputs.name }}-pdb.zip.sha256
            release-body.md
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.archive.outputs.name }}.zip
            ${{ steps.archive.outputs.name }}-pdb.zip
            ${{ steps.archive.outputs.name }}.zip.sha256
            ${{ steps.archive.outputs.name }}-pdb.zip.sha256
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
