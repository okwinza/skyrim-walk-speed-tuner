name: build

on:
  push:
    branches: [main]
    tags:     ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# CommonLibSSE-NG is consumed as a git submodule (see extern/CommonLibSSE-NG).
# vcpkg pulls in the transitive deps it needs (spdlog, directxtk, etc.) via
# our vcpkg.json "plugin" feature. Public registry only — no custom registry.

env:
  # vcpkg-tool commit. Match our vcpkg.json builtin-baseline so the tool
  # version aligns with the package versions our manifest expects.
  VCPKG_COMMIT: ee12231b20c95013c6638d845d04c91559a1d1ff

jobs:
  test:
    name: Tests (Catch2)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:GITHUB_WORKSPACE/vcpkg
          Set-Location $env:GITHUB_WORKSPACE/vcpkg
          git checkout $env:VCPKG_COMMIT
          .\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure (tests)
        run: cmake --preset tests

      - name: Build (tests)
        run: cmake --build build/tests

      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure

  build:
    name: Build & Package
    runs-on: windows-2022
    needs: test
    timeout-minutes: 60
    permissions:
      contents: write   # softprops/action-gh-release on tag pushes
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@master

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:GITHUB_WORKSPACE/vcpkg
          Set-Location $env:GITHUB_WORKSPACE/vcpkg
          git checkout $env:VCPKG_COMMIT
          .\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Cache the build directory keyed on the submodule SHA + cmake config
      # files. Saves ~10 min of CommonLibSSE-NG recompilation on cache hit.
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build/release
          key: build-release-${{ runner.os }}-${{ hashFiles('extern/CommonLibSSE-NG/**/*.cmake', 'extern/CommonLibSSE-NG/**/CMakeLists.txt', 'CMakeLists.txt', 'CMakePresets.json', 'cmake/**', 'vcpkg.json') }}-${{ hashFiles('.gitmodules') }}
          restore-keys: |
            build-release-${{ runner.os }}-

      - name: Configure (release)
        run: cmake --preset release

      - name: Build (release)
        run: cmake --build build/release

      - name: Compute archive name
        id: archive
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
              $name = "WalkSpeedTuner-${{ github.ref_name }}"
          } else {
              $shortSha = "${{ github.sha }}".Substring(0, 7)
              $name = "WalkSpeedTuner-${{ github.ref_name }}-$shortSha"
          }
          $name = $name -replace '[\\/]', '-'
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Stage release tree
        shell: pwsh
        run: |
          $stage = "stage/SKSE/Plugins"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build/release/bin/WalkSpeedTuner.dll $stage/
          Compress-Archive -Path stage/SKSE -DestinationPath "${{ steps.archive.outputs.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.name }}
          path: ${{ steps.archive.outputs.name }}.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.archive.outputs.name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
